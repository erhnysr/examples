<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shelby File Sharing</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 560px;
        margin: 48px auto;
        padding: 0 16px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 1.4rem;
      }
      .card {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 16px;
        margin-top: 16px;
      }
      .hash {
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
        word-break: break-all;
      }
      .error {
        color: #b00020;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Shelby File Sharing</h1>

    <section id="upload-view" hidden>
      <form id="upload-form" class="card">
        <input type="file" name="file" required />
        <button type="submit">Upload</button>
      </form>
      <div id="upload-result" class="card" hidden>
        <p>Share this link:</p>
        <p><a id="share-link"></a></p>
        <p>SHA-256: <span id="upload-hash" class="hash"></span></p>
        <p>Expires: <span id="upload-expires"></span></p>
      </div>
    </section>

    <section id="drop-view" class="card" hidden>
      <p><strong id="drop-name"></strong> (<span id="drop-size"></span>)</p>
      <p>SHA-256: <span id="drop-hash" class="hash"></span></p>
      <p>Expires: <span id="drop-expires"></span></p>
      <p><a id="drop-download">Download</a></p>
    </section>

    <p id="error" class="error" hidden></p>

    <script>
      const $ = (id) => document.getElementById(id);

      function showError(message) {
        $("error").textContent = message;
        $("error").hidden = false;
      }

      function formatSize(bytes) {
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
      }

      async function showDrop(id) {
        $("drop-view").hidden = false;
        const res = await fetch(`/drop/${encodeURIComponent(id)}`);
        if (!res.ok) {
          $("drop-view").hidden = true;
          showError("This drop was not found.");
          return;
        }
        const drop = await res.json();
        $("drop-name").textContent = drop.fileName;
        $("drop-size").textContent = formatSize(drop.fileSize);
        $("drop-hash").textContent = drop.sha256;
        $("drop-expires").textContent = new Date(drop.expiresAt).toLocaleString();
        $("drop-download").href = `/drop/${encodeURIComponent(id)}/download`;
      }

      function showUpload() {
        $("upload-view").hidden = false;
        $("upload-form").addEventListener("submit", async (event) => {
          event.preventDefault();
          $("error").hidden = true;
          const res = await fetch("/upload", {
            method: "POST",
            body: new FormData(event.target),
          });
          const body = await res.json();
          if (!res.ok) {
            showError(body.error ?? "Upload failed.");
            return;
          }
          const link = `${location.origin}/d/${body.id}`;
          $("share-link").href = link;
          $("share-link").textContent = link;
          $("upload-hash").textContent = body.sha256;
          $("upload-expires").textContent = new Date(body.expiresAt).toLocaleString();
          $("upload-result").hidden = false;
        });
      }

      const match = location.pathname.match(/^\/d\/([^/]+)\/?$/);
      if (match) showDrop(decodeURIComponent(match[1]));
      else showUpload();
    </script>
  </body>
</html>
